<!DOCTYPE html>
<!-- Adote um Amigo - Adoção de Pets — Catálogo com filtros (JavaScript) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adote um Amigo - Adoção de Pets</title>
  <meta name="description" content="Galeria de animais com filtro de espécie/porte." />
  <link rel="stylesheet" href="estilo/styles.css" />
  <style>
    .filtros { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:30px; }
    .filtro-btn {
      padding:10px 18px; border:2px solid var(--primary); background:#fff;
      color:var(--primary); border-radius:999px; cursor:pointer; font-weight:600;
      transition: all .2s;
    }
    .filtro-btn:hover, .filtro-btn.ativo { background:var(--primary); color:#fff; }
    .catalogo { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
    .item-card {
      background:#fff; border-radius:var(--radius); padding:20px;
      box-shadow:var(--shadow); text-align:center;
    }
    .item-card .img { font-size:4rem; margin-bottom:10px; }
    .item-card .preco { color:var(--primary); font-weight:800; font-size:1.2rem; margin-top:8px; }
    .vazio { text-align:center; color:var(--muted); padding:40px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <div class="logo">Adote um Amigo - Adoção de Pets</div>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul id="menu">
        <li><a href="#inicio">Início</a></li>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </div>
  </header>

  <section class="hero" id="inicio">
    <h1>Adote um Amigo - Adoção de Pets</h1>
    <p>Galeria de animais com filtro de espécie/porte.</p>
    <a href="#catalogo" class="btn">Explorar</a>
  </section>

  <section id="catalogo">
    <div class="container">
      <h2>Catálogo</h2>
      <p class="subtitle">Use os filtros para encontrar o ideal</p>
      <div class="filtros" id="filtros"><button class="filtro-btn" data-filtro="Todos">Todos</button><button class="filtro-btn" data-filtro="Cão Grande">Cão Grande</button><button class="filtro-btn" data-filtro="Cão Pequeno">Cão Pequeno</button><button class="filtro-btn" data-filtro="Gato">Gato</button></div>
      <div class="catalogo" id="lista"></div>
    </div>
  </section>

  <footer><p>© <span id="ano"></span> Adote um Amigo - Adoção de Pets</p></footer>

  <!-- Dados do catálogo embarcados (em projetos reais viria de uma API) -->
  <script>
    window.ITENS = [
      {"nome": "Thor", "categoria": "Cão Grande", "preco": "3 anos", "foto": "imagens/img1.png"},
      {"nome": "Mimi", "categoria": "Gato", "preco": "2 anos", "foto": "imagens/img5.png"},
      {"nome": "Bidu", "categoria": "Cão Pequeno", "preco": "1 ano", "foto": "imagens/img2.png"},
      {"nome": "Luna", "categoria": "Gato", "preco": "5 anos", "foto": "imagens/img6.png"},
      {"nome": "Rex", "categoria": "Cão Grande", "preco": "4 anos", "foto": "imagens/img4.png"},
      {"nome": "Pipoca", "categoria": "Cão Pequeno", "preco": "6 meses", "foto": "imagens/img3.png"},
      {"nome": "bela", "categoria": "Filhote", "preco": "5 meses", "foto": "imagens/img7.png"},
      {"nome": "Luna", "categoria": "Cão Pequeno", "preco": "2ano", "foto": "imagens/img8.png"},
      {"nome": "Dama", "categoria": "Cão Grande", "preco": "1anos", "foto": "imagens/img9.png"},
      {"nome": "Moranguinho", "categoria": "Gato", "preco": "3 anos", "foto": "imagens/img10.png"},
    ];
    window.LABEL_PRECO = "Idade:";
</script>
  <script src="js/script.js"></script>
</body>
</html>
